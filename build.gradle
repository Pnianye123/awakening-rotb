plugins {
    id 'fabric-loom' version '1.9.2'
    id 'maven-publish'
    id 'java'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archivesBaseName
}

repositories {
    // Add repositories to retrieve artifacts from here.
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
}

loom {
    // mixin refmap —— 生产环境（intermediary）下 client mixin 要靠它映射回原版方法名
    mixin {
        defaultRefmapName = "awakening-rotb-refmap.json"
    }
}

dependencies {
    // To change the versions see the gradle.properties file.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.110.0+${project.minecraft_version}"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// jar task 不需要自定义——gradle 默认会用 archivesBaseName 生成 jar，
// LICENSE 文件会保留在 jar 根目录

